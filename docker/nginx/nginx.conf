# nginx for the production image (docker/Dockerfile.prod). Runs in the
# foreground under supervisord; workers drop to www-data.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # The load balancer terminates TLS and sets X-Forwarded-*. Log and rate
    # limit on the client's address, not the balancer's. Laravel's
    # trustProxies does the same inside PHP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","referer":"$http_referer","agent":"$http_user_agent"}';
    access_log /dev/stdout main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
        application/xml+rss image/svg+xml font/ttf font/otf;

    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml
        application/xml+rss image/svg+xml font/ttf font/otf;

    include /etc/nginx/conf.d/*.conf;
}
