server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # The app accepts 20 MB PDFs and up to 20 MB of autosaved state; php.ini's
    # post_max_size matches this.
    client_max_body_size 32m;
    client_body_timeout 120s;

    # Vite's output is content-hashed: a changed file has a new name.
    location /build/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images and signatures users placed on documents are private files served
    # by the app (documents.annotationAsset). Anything still under the public
    # disk from before `documents:migrate-annotation-assets` is not handed out.
    location ^~ /storage/annotation-assets/ {
        return 404;
    }

    # The editor's own web fonts: the file name carries the font's version.
    location ^~ /fonts/editor/files/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # A request may wait on a Python process with a 180 s timeout
        # (config/python.php). php-fpm's own limit sits just above this.
        fastcgi_read_timeout 200s;
        fastcgi_send_timeout 200s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Exports and previews stream through PHP: do not spool them to disk first.
        fastcgi_max_temp_file_size 0;
        internal;
    }

    # php-fpm's own status, for the container's health check only.
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        access_log off;
    }

    # No other PHP file is ever executed, and dotfiles are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
