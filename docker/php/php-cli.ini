; php-cli: Horizon workers, the scheduler, artisan. Horizon enforces its own
; per-supervisor memory limits (config/horizon.php); this is the backstop.
memory_limit = 1024M
variables_order = EGPCS
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
; Workers are long-lived: compiled code is reused across jobs.
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.jit = off
