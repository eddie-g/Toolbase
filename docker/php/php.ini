; php-fpm (web requests). Tracked: the development image's php.ini lives in
; vendor/ and only raised the upload limits.

memory_limit = 512M
; CPU time of the PHP script itself. Time spent waiting for a Python process
; does not count on Linux; nginx's fastcgi_read_timeout bounds that instead.
max_execution_time = 120
max_input_time = 120

; The app accepts PDFs up to 20 MB and autosaves up to 20 MB of state
; (PDF_UPLOAD_MAX_KB, PDF_AUTOSAVE_MAX_BODY_KB). nginx allows 32 MB.
upload_max_filesize = 25M
post_max_size = 32M
max_file_uploads = 20

; Environment variables are the configuration: make them reach $_ENV.
variables_order = EGPCS
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; The code in the image never changes: never stat it. A deploy is a new container.
opcache.validate_timestamps = 0
opcache.jit = off

[session]
session.cookie_httponly = 1
