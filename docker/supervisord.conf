[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
; PHP_CLI_SERVER_WORKERS lets `artisan serve` (built-in PHP web server) handle
; concurrent requests. Required for endpoints like /api/pdf-tests/run that
; shell_exec a Playwright node script which itself calls back into the same
; Laravel server — without workers the single-threaded server deadlocks until
; the outer request times out.
environment=LARAVEL_SAIL="1",PHP_CLI_SERVER_WORKERS="8"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=/usr/bin/php /var/www/html/artisan horizon
user=sail
directory=/var/www/html
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
