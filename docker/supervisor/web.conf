; The web role: nginx in front of php-fpm, in one container (one ingress).
; If either exits for good, supervisord exits and the platform restarts the
; container, rather than leaving half a web server behind a healthy-looking port.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --force-stderr
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:exit-when-fatal]
command=/bin/sh -c "printf 'READY\n'; while read line; do kill -TERM 1; done"
events=PROCESS_STATE_FATAL
